[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drivershub-migration-tools"
version = "0.1.0"
description = "Assessment and migration tools for Drivers Hub"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Kosmos", email = "me@kosmos.ac" }]
dependencies = ["PyMySQL>=1.1,<2", "zstandard>=0.23,<1"]

[project.urls]
Homepage = "https://kosmos.ac"
Repository = "https://github.com/kosmosac/DriversHubMigrationTools"

[project.scripts]
drivershub-migrate = "drivershub_migration.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
